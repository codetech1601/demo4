# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
 branches:
   include:
     - main

pool:
  vmImage: ubuntu-latest

steps:
- task: JavaToolInstaller@0
  displayName: 'Install Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  
- task: Maven@4
  displayName: 'Build and Test Java Project'
  inputs:
    mavenPomFile: 'demo/pom.xml'
    goals: 'clean verify'
    publishJUnitResults: true 
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: JDKVersion
    jdkVersionOption: 1.17
    mavenVersionOption: 'Default'
  
- script: |
   docker build -t demo-app:$(Build.BuildId) -f demo/Dockerfile demo
  displayName: 'Build Docker Image'

- script: |
   set -e
   echo "Logging into GitHub Container Registry..."
   echo "$GHCR_TOKEN" | docker login ghcr.io -u codetech1601 --password-stdin
   echo "Tagging Docker image"
   docker tag demo-app:$(Build.BuildId) ghcr.io/codetech1601/demo-app:$(Build.BuildId)
   echo "Pushing Docker image to GHCR"
   docker push ghcr.io/codetech1601/demo-app:$(Build.BuildId)
   echo "Logging out from GHCR"
   docker logout ghcr.io
   echo "Docker image successfully published!"
  displayName: "Push Docker Image to GHCR"
  env:
    GHCR_TOKEN: $(GHCR_TOKEN)

- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    searchFolder: '$(System.DefaultWorkingDirectory)/demo'
    failTaskOnFailedTests: false
    testRunTitle: 'Java Unit Tests'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact'
  condition: succeeded()
  inputs:
   PathtoPublish: 'demo/target'
   ArtifactName: 'JavaApplication'
   publishLocation: 'Container'

- task: AzureCLI@2
  displayName: 'Deploy latest image to DEV'
  inputs:
    azureSubscription: 'sc-azure-containerapps'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
     set -e 
     echo "Deploying Docker image to DEV..."
     az extension add --name containerapp --upgrade
     az containerapp update --name demo-dev --resource-group rg-demo-app --image ghcr.io/codetech1601/demo-app:$(Build.BuildId)
     echo "DEV deployment command completed..."
